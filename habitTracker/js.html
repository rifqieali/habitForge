<script>
var App = {
  state: {
    activeTab: 'dashboard',
    habits: [],
    todayLogs: [],
    streaks: [],
    config: {},
    todayStr: '',
    loading: true,
    modalOpen: false
  },
  
  init: function() {
    App.bindTabNavigation();
    App.bindFAB();
    App.loadDashboardData();
  },
  
  setState: function(updates) {
    Object.keys(updates).forEach(function(k) { App.state[k] = updates[k]; });
    App.render();
  },
  
  render: function() {
    switch (App.state.activeTab) {
      case 'dashboard': renderDashboard(); break;
      case 'history': if (typeof renderHistory === 'function') renderHistory(); break;
      case 'stats': if (typeof renderStats === 'function') renderStats(); break;
      case 'settings': if (typeof renderSettings === 'function') renderSettings(); break;
    }
  },
  
  switchTab: function(tabName) {
    App.state.activeTab = tabName;
    document.querySelectorAll('.tab-panel').forEach(function(p) {
      p.classList.remove('active');
    });
    var activePanel = document.getElementById('tab-' + tabName);
    if (activePanel) activePanel.classList.add('active');
    
    document.querySelectorAll('.tab-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.tab === tabName);
    });
    
    var fab = document.getElementById('fab');
    if (fab) fab.style.display = tabName === 'dashboard' ? 'flex' : 'none';
    
    App.render();
  },
  
  bindTabNavigation: function() {
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        App.switchTab(this.dataset.tab);
      });
    });
  },
  
  bindFAB: function() {
    var fab = document.getElementById('fab');
    if (fab) {
      fab.addEventListener('click', function() {
        showAddHabitSheet();
      });
    }
  },
  
  loadDashboardData: function() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      // Mock data for local development/test if needed
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      document.getElementById('tab-bar').style.display = 'flex';
      document.getElementById('fab').style.display = 'flex';
      App.render();
      return;
    }
    
    google.script.run
      .withSuccessHandler(function(data) {
        App.setState({
          habits: data.habits || [],
          todayLogs: data.todayLogs || [],
          streaks: data.streaks || [],
          config: data.config || {},
          todayStr: data.todayStr || '',
          loading: false
        });
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('tab-bar').style.display = 'flex';
        document.getElementById('fab').style.display = 'flex';
      })
      .withFailureHandler(function(err) {
        document.getElementById('loading-screen').innerHTML =
          '<div class="error-state">⚠️ Failed to load: ' + err.message + '</div>';
      })
      .api_getDashboardData();
  },
  
  showToast: function(message, type) {
    var toast = document.createElement('div');
    toast.className = 'toast toast-' + (type || 'info');
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(function() { toast.classList.add('show'); }, 10);
    setTimeout(function() {
      toast.classList.remove('show');
      setTimeout(function() { toast.remove(); }, 300);
    }, 3000);
  }
};

// Dashboard Renderer
function renderDashboard() {
  var container = document.getElementById('tab-dashboard');
  if (!container) return;
  
  var habits = App.state.habits || [];
  var logs = App.state.todayLogs || [];
  var streaks = App.state.streaks || [];
  
  // Find max streak across habits
  var maxStreak = streaks.reduce(function(max, s) {
    return Math.max(max, Number(s.current_streak) || 0);
  }, 0);
  
  // Count completed today
  var completedCount = habits.filter(function(h) {
    var l = logs.filter(function(log) { return log.habit_id === h.id; })[0];
    return l && (l.completed === true || l.completed === 'true');
  }).length;
  
  var totalCount = habits.length;
  var dashPercent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
  var strokeDash = 157; // 2 * PI * 25
  var strokeOffset = strokeDash - (strokeDash * dashPercent / 100);
  
  // Sort habits: uncompleted first, completed last
  var sortedHabits = habits.slice().sort(function(a, b) {
    var aDone = logs.some(function(l) { return l.habit_id === a.id && (l.completed === true || l.completed === 'true'); });
    var bDone = logs.some(function(l) { return l.habit_id === b.id && (l.completed === true || l.completed === 'true'); });
    if (aDone === bDone) return (a.sort_order || 0) - (b.sort_order || 0);
    return aDone ? 1 : -1;
  });
  
  var habitsHTML = sortedHabits.length > 0
    ? sortedHabits.map(function(h) {
        var log = logs.filter(function(l) { return l.habit_id === h.id; })[0];
        var streak = streaks.filter(function(s) { return s.habit_id === h.id; })[0];
        return renderHabitCardHTML(h, log, streak);
      }).join('')
    : `<div class="empty-state">
         <div class="empty-icon">🚀</div>
         <p>Belum ada habit. Tekan <b>+</b> untuk membuat habit baru!</p>
       </div>`;

  container.innerHTML = `
    <div class="streak-banner">
      <div class="streak-number">🔥 ${maxStreak} Hari</div>
      <div class="streak-subtitle">Best Current Streak</div>
    </div>
    
    <div class="progress-container">
      <div class="progress-text-group">
        <h3>Hari Ini</h3>
        <p>${completedCount} dari ${totalCount} habit selesai</p>
      </div>
      <svg class="progress-svg" viewBox="0 0 60 60">
        <defs>
          <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
          </linearGradient>
        </defs>
        <circle class="progress-bg-circle" cx="30" cy="30" r="25" />
        <circle class="progress-fill-circle" cx="30" cy="30" r="25"
                stroke-dasharray="${strokeDash}"
                stroke-dashoffset="${strokeOffset}" />
      </svg>
    </div>
    
    <div class="section-title">
      <span>Daftar Habit</span>
    </div>
    
    <div class="habit-list">
      ${habitsHTML}
    </div>
  `;
}

// Check-in Interactions
function handleHabitTap(habitId, type) {
  if (type === 'boolean') {
    handleBooleanCheckIn(habitId);
  } else {
    var inlineInput = document.getElementById('inline-input-' + habitId);
    if (inlineInput) {
      var isHidden = inlineInput.style.display === 'none';
      inlineInput.style.display = isHidden ? 'flex' : 'none';
    }
  }
}

function handleBooleanCheckIn(habitId) {
  var logs = App.state.todayLogs || [];
  var existingLog = logs.filter(function(l) { return l.habit_id === habitId; })[0];
  var isDone = existingLog && (existingLog.completed === true || existingLog.completed === 'true');
  
  if (isDone) {
    // Uncheck
    App.state.todayLogs = logs.filter(function(l) { return l.habit_id !== habitId; });
    App.render();
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withFailureHandler(function(err) { App.showToast('Gagal update: ' + err.message, 'error'); })
        .api_uncheckIn(habitId);
    }
  } else {
    // Check in
    var newLog = { habit_id: habitId, value: 1, completed: true, date: App.state.todayStr };
    App.state.todayLogs = logs.concat([newLog]);
    App.render();
    App.showToast('Great job! Habit selesai 🎉', 'success');
    
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.streak) {
            var streaks = App.state.streaks.filter(function(s) { return s.habit_id !== habitId; });
            App.state.streaks = streaks.concat([res.streak]);
            App.render();
          }
        })
        .withFailureHandler(function(err) { App.showToast('Gagal update: ' + err.message, 'error'); })
        .api_checkIn(habitId, 1);
    }
  }
}

function submitInlineInput(habitId, type) {
  var inputEl = document.getElementById('input-val-' + habitId);
  if (!inputEl) return;
  var val = Number(inputEl.value) || 0;
  
  var inlineInput = document.getElementById('inline-input-' + habitId);
  if (inlineInput) inlineInput.style.display = 'none';
  
  var habit = App.state.habits.filter(function(h) { return h.id === habitId; })[0];
  var target = habit ? Number(habit.target) || 1 : 1;
  var completed = val >= target;
  
  var logs = App.state.todayLogs.filter(function(l) { return l.habit_id !== habitId; });
  logs.push({ habit_id: habitId, value: val, completed: completed, date: App.state.todayStr });
  App.state.todayLogs = logs;
  App.render();
  
  if (completed) App.showToast('Target tercapai! 🔥', 'success');
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.streak) {
          var streaks = App.state.streaks.filter(function(s) { return s.habit_id !== habitId; });
          App.state.streaks = streaks.concat([res.streak]);
          App.render();
        }
      })
      .withFailureHandler(function(err) { App.showToast('Gagal check-in: ' + err.message, 'error'); })
      .api_checkIn(habitId, val);
  }
}

// Add Habit Bottom Sheet
function showAddHabitSheet() {
  var sheet = document.getElementById('bottom-sheet');
  var overlay = document.getElementById('modal-overlay');
  sheet.innerHTML = renderAddHabitFormHTML();
  overlay.classList.add('active');
  sheet.classList.add('active');
}

function closeBottomSheet() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.getElementById('bottom-sheet').classList.remove('active');
}

function selectHabitType(type) {
  document.getElementById('habit-type-val').value = type;
  document.querySelectorAll('[data-type]').forEach(function(b) {
    b.classList.toggle('active', b.dataset.type === type);
  });
  
  var targetGroup = document.getElementById('target-group');
  var unitGroup = document.getElementById('unit-group');
  var targetLabel = document.getElementById('target-label');
  
  if (type === 'boolean') {
    targetGroup.style.display = 'none';
    unitGroup.style.display = 'none';
  } else if (type === 'quantitative') {
    targetGroup.style.display = 'flex';
    unitGroup.style.display = 'flex';
    targetLabel.textContent = 'Target Angka';
  } else if (type === 'duration') {
    targetGroup.style.display = 'flex';
    unitGroup.style.display = 'none';
    targetLabel.textContent = 'Target Durasi (Menit)';
  }
}

function selectFrequency(freq) {
  document.getElementById('habit-freq-val').value = freq;
  document.querySelectorAll('[data-freq]').forEach(function(b) {
    b.classList.toggle('active', b.dataset.freq === freq);
  });
  
  var freqValGroup = document.getElementById('freq-val-group');
  var freqValLabel = document.getElementById('freq-val-label');
  
  if (freq === 'daily') {
    freqValGroup.style.display = 'none';
  } else if (freq === 'weekly_count') {
    freqValGroup.style.display = 'flex';
    freqValLabel.textContent = 'Target per minggu (kali)';
  } else if (freq === 'specific_days') {
    freqValGroup.style.display = 'flex';
    freqValLabel.textContent = 'Hari (misal: 1,3,5 untuk Senin,Rabu,Jumat)';
  }
}

function selectColor(hex, el) {
  document.getElementById('habit-color-val').value = hex;
  document.querySelectorAll('.color-circle').forEach(function(c) { c.classList.remove('selected'); });
  el.classList.add('selected');
}

function selectIcon(icon, el) {
  document.getElementById('habit-icon-val').value = icon;
  document.querySelectorAll('.emoji-item').forEach(function(e) { e.classList.remove('selected'); });
  el.classList.add('selected');
}

function saveNewHabit(e) {
  e.preventDefault();
  var habitData = {
    name: document.getElementById('habit-name').value,
    type: document.getElementById('habit-type-val').value,
    target: Number(document.getElementById('habit-target').value) || 1,
    unit: document.getElementById('habit-unit').value || '',
    frequency: document.getElementById('habit-freq-val').value,
    frequency_value: document.getElementById('habit-freq-val-input').value || '',
    color: document.getElementById('habit-color-val').value,
    icon: document.getElementById('habit-icon-val').value
  };
  
  closeBottomSheet();
  App.showToast('Menyimpan habit...', 'info');
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(newHabit) {
        App.state.habits.push(newHabit);
        App.render();
        App.showToast('Habit berhasil dibuat! 🚀', 'success');
      })
      .withFailureHandler(function(err) {
        App.showToast('Gagal membuat habit: ' + err.message, 'error');
      })
      .api_createHabit(habitData);
  } else {
    habitData.id = 'mock-' + Date.now();
    App.state.habits.push(habitData);
    App.render();
    App.showToast('Habit berhasil dibuat (mock)! 🚀', 'success');
  }
}

// History Renderer
var currentHistoryYear = new Date().getFullYear();
var currentHistoryMonth = new Date().getMonth();

function renderHistory() {
  var container = document.getElementById('tab-history');
  if (!container) return;
  
  container.innerHTML = `
    <div class="section-title">
      <span>Contribution Graph (52 Minggu)</span>
    </div>
    <div class="contribution-graph">
      <div class="graph-grid" id="contrib-graph-grid">
        ${renderContributionCells()}
      </div>
    </div>
    
    <div class="section-title">
      <span>Jadwal Bulanan</span>
    </div>
    <div class="calendar-view">
      <div class="calendar-header">
        <button class="btn-close" onclick="changeMonth(-1)">◀</button>
        <span id="cal-month-title" style="font-weight:700;"></span>
        <button class="btn-close" onclick="changeMonth(1)">▶</button>
      </div>
      <div class="calendar-grid" id="calendar-grid-cells"></div>
    </div>
  `;
  
  updateCalendarGrid();
}

function renderContributionCells() {
  var cells = [];
  var totalDays = 52 * 7;
  var logs = App.state.todayLogs || [];
  
  for (var i = 0; i < totalDays; i++) {
    var level = (i % 7 === 0 && i < 70) ? 'level-2' : ((i % 13 === 0) ? 'level-4' : '');
    cells.push(`<div class="graph-cell ${level}"></div>`);
  }
  return cells.join('');
}

function updateCalendarGrid() {
  var titleEl = document.getElementById('cal-month-title');
  var gridEl = document.getElementById('calendar-grid-cells');
  if (!gridEl || !titleEl) return;
  
  var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  titleEl.textContent = months[currentHistoryMonth] + ' ' + currentHistoryYear;
  
  var firstDay = new Date(currentHistoryYear, currentHistoryMonth, 1).getDay();
  var daysInMonth = new Date(currentHistoryYear, currentHistoryMonth + 1, 0).getDate();
  var todayStr = App.state.todayStr || new Date().toISOString().split('T')[0];
  
  var html = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(function(d) {
    return `<div class="cal-day-label">${d}</div>`;
  }).join('');
  
  for (var empty = 0; empty < firstDay; empty++) {
    html += `<div class="cal-day-cell" style="opacity:0;"></div>`;
  }
  
  for (var day = 1; day <= daysInMonth; day++) {
    var dStr = currentHistoryYear + '-' + String(currentHistoryMonth + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    var isToday = dStr === todayStr;
    
    html += `
      <div class="cal-day-cell ${isToday ? 'today' : ''}" onclick="showDayDetail('${dStr}')">
        ${day}
        ${isToday ? '<div class="cal-dot"></div>' : ''}
      </div>
    `;
  }
  
  gridEl.innerHTML = html;
}

function changeMonth(delta) {
  currentHistoryMonth += delta;
  if (currentHistoryMonth > 11) {
    currentHistoryMonth = 0;
    currentHistoryYear++;
  } else if (currentHistoryMonth < 0) {
    currentHistoryMonth = 11;
    currentHistoryYear--;
  }
  updateCalendarGrid();
}

function showDayDetail(dateStr) {
  var sheet = document.getElementById('bottom-sheet');
  var overlay = document.getElementById('modal-overlay');
  var habits = App.state.habits || [];
  
  var habitItems = habits.length > 0 ? habits.map(function(h) {
    return `
      <div class="settings-item">
        <div style="display:flex;align-items:center;gap:12px;">
          <span>${h.icon || '⭐'}</span>
          <span>${h.name}</span>
        </div>
        <span class="pill-btn active" style="padding:4px 8px;font-size:0.75rem;">Scheduled</span>
      </div>
    `;
  }).join('') : '<p class="empty-state">Tidak ada log untuk tanggal ini.</p>';

  sheet.innerHTML = `
    <div class="sheet-header">
      <h3>Detail: ${dateStr}</h3>
      <button class="btn-close" onclick="closeBottomSheet()">✕</button>
    </div>
    <div class="settings-group">
      ${habitItems}
    </div>
  `;
  
  overlay.classList.add('active');
  sheet.classList.add('active');
}

// Stats Renderer
function renderStats() {
  var container = document.getElementById('tab-stats');
  if (!container) return;
  
  var habits = App.state.habits || [];
  var streaks = App.state.streaks || [];
  var logs = App.state.todayLogs || [];
  
  var totalCompleted = logs.filter(function(l) { return l.completed === true || l.completed === 'true'; }).length;
  var overallRate = habits.length > 0 ? Math.min(100, Math.round((totalCompleted / Math.max(1, habits.length)) * 100)) : 0;
  
  var habitStatCards = habits.length > 0 ? habits.map(function(h) {
    var streak = streaks.filter(function(s) { return s.habit_id === h.id; })[0] || {};
    var currentS = streak.current_streak || 0;
    var longestS = streak.longest_streak || 0;
    
    return `
      <div class="habit-card" style="border-left: 4px solid ${h.color || '#8b5cf6'};">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:1.4rem;">${h.icon || '⭐'}</span>
            <span style="font-weight:700;">${h.name}</span>
          </div>
          <span style="color:var(--text-secondary);font-size:0.8rem;">↑ 100%</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:0.85rem;color:var(--text-secondary);">
          <span>Streak Saat Ini: <b style="color:var(--accent-amber);">🔥 ${currentS}</b></span>
          <span>Rekor Terbaik: <b style="color:var(--accent-purple);">🏆 ${longestS}</b></span>
        </div>
      </div>
    `;
  }).join('') : '<p class="empty-state">Belum ada habit untuk ditampilkan statistik.</p>';
  
  var dayNames = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
  var dayBars = dayNames.map(function(d, idx) {
    var pct = idx % 2 === 0 ? 80 : 40;
    return `
      <div style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;font-size:0.75rem;margin-bottom:2px;color:var(--text-secondary);">
          <span>${d}</span>
          <span>${pct}%</span>
        </div>
        <div style="height:8px;background:var(--bg-elevated);border-radius:4px;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:var(--gradient-primary);border-radius:4px;"></div>
        </div>
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="section-title">
      <span>Ringkasan Performa</span>
    </div>
    
    <div class="stats-overview">
      <div class="stat-card">
        <div class="stat-value">${overallRate}%</div>
        <div class="stat-label">Completion Rate</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="color:var(--accent-amber);">${totalCompleted}</div>
        <div class="stat-label">Habit Selesai</div>
      </div>
    </div>
    
    <div class="section-title">
      <span>Performa Per Habit</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px;">
      ${habitStatCards}
    </div>
    
    <div class="section-title">
      <span>Konsistensi per Hari</span>
    </div>
    <div class="calendar-view" style="padding:16px;">
      ${dayBars}
    </div>
  `;
}

// Settings Renderer
function renderSettings() {
  var container = document.getElementById('tab-settings');
  if (!container) return;
  
  var config = App.state.config || {};
  var habits = App.state.habits || [];
  var autoFreeze = config.auto_freeze === 'true' || config.auto_freeze === true;
  var calendarEnabled = config.calendar_enabled === 'true' || config.calendar_enabled === true;
  
  var habitListHTML = habits.map(function(h) {
    return `
      <div class="settings-item" onclick="showEditHabitSheet('${h.id}')" style="cursor:pointer;">
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:1.2rem;">${h.icon || '⭐'}</span>
          <span>${h.name}</span>
        </div>
        <span style="color:var(--text-muted);font-size:0.8rem;">Edit ⚙️</span>
      </div>
    `;
  }).join('') || '<p class="empty-state">Belum ada habit.</p>';

  container.innerHTML = `
    <div class="section-title">
      <span>Pengaturan Streak Freeze</span>
    </div>
    <div class="settings-group">
      <div class="settings-item">
        <div>
          <div style="font-weight:600;">Auto Streak Freeze ❄️</div>
          <div style="font-size:0.75rem;color:var(--text-secondary);">Gunakan freeze otomatis jika miss 1 hari (2/bulan)</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-auto-freeze" ${autoFreeze ? 'checked' : ''} onchange="toggleAutoFreeze(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="section-title">
      <span>Google Calendar Integration 📅</span>
    </div>
    <div class="settings-group">
      <div class="settings-item">
        <div>
          <div style="font-weight:600;">Sinkronkan ke Calendar</div>
          <div style="font-size:0.75rem;color:var(--text-secondary);">Tulis event otomatis saat habit selesai</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-calendar" ${calendarEnabled ? 'checked' : ''} onchange="toggleCalendar(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <div class="form-group" style="padding-top:12px;">
        <label>Calendar ID</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="calendar-id-input" class="form-input" value="${config.calendar_id || 'primary'}">
          <button class="btn-inline" onclick="testCalendarConnection()">Test</button>
        </div>
      </div>
    </div>

    <div class="section-title">
      <span>Kelola Habit</span>
    </div>
    <div class="settings-group">
      ${habitListHTML}
    </div>

    <div class="section-title">
      <span>System & Storage 📊</span>
    </div>
    <div class="settings-group">
      <div class="settings-item" onclick="openSpreadsheet()" style="cursor:pointer;">
        <div>
          <div style="font-weight:600;">Buka Google Spreadsheet</div>
          <div style="font-size:0.75rem;color:var(--text-secondary);">Lihat database & dashboard analitik mentah</div>
        </div>
        <span>↗</span>
      </div>
      <div class="settings-item" onclick="installMidnightTrigger()" style="cursor:pointer;">
        <div>
          <div style="font-weight:600;">Install Trigger Tengah Malam</div>
          <div style="font-size:0.75rem;color:var(--text-secondary);">Set pemicu otomatis streak & freeze jam 00.05</div>
        </div>
        <span>⚙️</span>
      </div>
    </div>
  `;
}

function toggleAutoFreeze(enabled) {
  App.state.config.auto_freeze = enabled ? 'true' : 'false';
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.api_setConfig('auto_freeze', enabled ? 'true' : 'false');
  }
  App.showToast('Pengaturan auto-freeze disimpan', 'info');
}

function toggleCalendar(enabled) {
  App.state.config.calendar_enabled = enabled ? 'true' : 'false';
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.api_setConfig('calendar_enabled', enabled ? 'true' : 'false');
  }
  App.showToast('Pengaturan calendar disimpan', 'info');
}

function testCalendarConnection() {
  var calId = document.getElementById('calendar-id-input').value;
  App.showToast('Menghubungkan ke Calendar...', 'info');
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          App.showToast('Tersambung ke: ' + res.calendarName + ' ✅', 'success');
          google.script.run.api_setConfig('calendar_id', calId);
        } else {
          App.showToast('Gagal: ' + (res.calendarName || 'Tidak dapat menemukan kalender'), 'error');
        }
      })
      .api_testCalendar();
  } else {
    App.showToast('Tersambung (Mock Calendar) ✅', 'success');
  }
}

function openSpreadsheet() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(url) { window.open(url, '_blank'); })
      .api_getSpreadsheetUrl();
  } else {
    App.showToast('Membuka Google Spreadsheet (mock)', 'info');
  }
}

function installMidnightTrigger() {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function() { App.showToast('Trigger otomatis berhasil diinstall! ⚙️', 'success'); })
      .installMidnightTrigger();
  } else {
    App.showToast('Trigger diinstall (mock)', 'success');
  }
}

function showEditHabitSheet(habitId) {
  var habit = App.state.habits.filter(function(h) { return h.id === habitId; })[0];
  if (!habit) return;
  
  var sheet = document.getElementById('bottom-sheet');
  var overlay = document.getElementById('modal-overlay');
  
  sheet.innerHTML = `
    <div class="sheet-header">
      <h3>Edit Habit</h3>
      <button class="btn-close" onclick="closeBottomSheet()">✕</button>
    </div>
    <div class="form-group">
      <label>Nama Habit</label>
      <input type="text" id="edit-habit-name" class="form-input" value="${habit.name}">
    </div>
    <button class="btn-primary" onclick="saveEditHabit('${habit.id}')">Simpan Perubahan</button>
    <button class="btn-primary" style="background:var(--accent-rose);margin-top:8px;" onclick="deleteHabitConfirm('${habit.id}')">Hapus Habit</button>
  `;
  
  overlay.classList.add('active');
  sheet.classList.add('active');
}

function saveEditHabit(habitId) {
  var newName = document.getElementById('edit-habit-name').value;
  var habit = App.state.habits.filter(function(h) { return h.id === habitId; })[0];
  if (habit) habit.name = newName;
  
  closeBottomSheet();
  App.render();
  App.showToast('Habit berhasil diperbarui!', 'success');
  
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.api_updateHabit(habitId, { name: newName });
  }
}

function deleteHabitConfirm(habitId) {
  if (confirm('Yakin ingin menghapus habit ini beserta seluruh histori & streak-nya?')) {
    App.state.habits = App.state.habits.filter(function(h) { return h.id !== habitId; });
    closeBottomSheet();
    App.render();
    App.showToast('Habit dihapus', 'info');
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.api_deleteHabit(habitId);
    }
  }
}

document.addEventListener('DOMContentLoaded', App.init);
</script>
