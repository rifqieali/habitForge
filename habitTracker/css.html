<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');

:root {
  /* Colors */
  --bg-base: #0a0a0f;
  --bg-card: #12121a;
  --bg-card-hover: #1a1a25;
  --bg-elevated: #1e1e2a;
  --bg-input: #16161f;
  --border: #2a2a3a;
  --border-focus: #8b5cf6;
  
  --text-primary: #f0f0f5;
  --text-secondary: #8888a0;
  --text-muted: #555570;
  
  --accent-purple: #8b5cf6;
  --accent-cyan: #06b6d4;
  --accent-amber: #f59e0b;
  --accent-rose: #f43f5e;
  --accent-emerald: #10b981;
  --accent-blue: #3b82f6;
  --accent-pink: #ec4899;
  --accent-indigo: #6366f1;
  
  --gradient-primary: linear-gradient(135deg, #8b5cf6, #06b6d4);
  --gradient-streak: linear-gradient(135deg, #f59e0b, #f43f5e);
  --gradient-success: linear-gradient(135deg, #10b981, #06b6d4);
  
  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  
  /* Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 9999px;
  
  /* Shadows & Glows */
  --shadow-card: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-glow-purple: 0 0 30px rgba(139,92,246,0.3);
  --shadow-glow-streak: 0 0 30px rgba(245,158,11,0.3);
  
  /* Typography */
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 2rem;
  --text-4xl: 2.5rem;
  --text-5xl: 3.5rem;
  
  /* Z-index */
  --z-tab-bar: 100;
  --z-fab: 90;
  --z-overlay: 150;
  --z-modal: 200;
  --z-toast: 300;
  
  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 400ms cubic-bezier(0.16, 1, 0.3, 1);
}

/* Reset & Layout */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  background-color: var(--bg-base);
}

/* Loading Screen */
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: var(--space-md);
  text-align: center;
}

.loading-logo {
  font-size: 4rem;
  animation: pulse-glow 2s infinite ease-in-out;
}

.loading-text {
  font-size: var(--text-2xl);
  font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.loading-spinner {
  width: 36px;
  height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--accent-purple);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

/* Main Content Area */
.main-content {
  flex: 1;
  padding: var(--space-md) var(--space-md) 100px var(--space-md);
}

.tab-panel {
  display: none;
  animation: fade-in 300ms ease;
}

.tab-panel.active {
  display: block;
}

/* Tab Bar */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: 72px;
  background: rgba(18, 18, 26, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: var(--z-tab-bar);
  padding-bottom: env(safe-area-inset-bottom);
}

.tab-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  padding: 8px 16px;
  min-height: 48px;
  min-width: 48px;
  transition: color var(--transition-fast);
}

.tab-btn.active {
  color: var(--accent-purple);
}

.tab-icon {
  font-size: 1.4rem;
}

.tab-label {
  font-size: var(--text-xs);
  font-weight: 600;
}

/* Streak Banner */
.streak-banner {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: var(--space-lg);
  text-align: center;
  margin-bottom: var(--space-lg);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-glow-streak);
}

.streak-banner::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(245,158,11,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.streak-number {
  font-size: var(--text-4xl);
  font-weight: 900;
  background: var(--gradient-streak);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xs);
}

.streak-subtitle {
  color: var(--text-secondary);
  font-size: var(--text-sm);
  margin-top: var(--space-xs);
}

/* Progress Ring Component */
.progress-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  margin-bottom: var(--space-lg);
}

.progress-text-group h3 {
  font-size: var(--text-lg);
  font-weight: 700;
}

.progress-text-group p {
  color: var(--text-secondary);
  font-size: var(--text-sm);
}

.progress-svg {
  width: 60px;
  height: 60px;
  transform: rotate(-90deg);
}

.progress-bg-circle {
  stroke: var(--bg-elevated);
  stroke-width: 6;
  fill: none;
}

.progress-fill-circle {
  stroke: url(#progress-gradient);
  stroke-width: 6;
  fill: none;
  stroke-linecap: round;
  transition: stroke-dashoffset var(--transition-slow);
}

/* Section Header */
.section-title {
  font-size: var(--text-lg);
  font-weight: 700;
  margin-bottom: var(--space-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Habit Card */
.habit-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
}

.habit-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  display: flex;
  flex-direction: column;
  gap: var(--space-sm);
  transition: all var(--transition-base);
  position: relative;
  overflow: hidden;
}

.habit-card:active {
  transform: scale(0.98);
}

.habit-card-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;

}

.habit-info {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

.habit-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  background: var(--bg-elevated);
  flex-shrink: 0;
}

.habit-details h4 {
  font-size: var(--text-base);
  font-weight: 600;
}

.habit-details p {
  color: var(--text-secondary);
  font-size: var(--text-xs);
  margin-top: 2px;
}

.check-box {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
  color: transparent;
  font-size: 1rem;
}

.habit-card.completed {
  border-color: rgba(16, 185, 129, 0.3);
  background: rgba(18, 18, 26, 0.6);
  opacity: 0.75;
}

.habit-card.completed .check-box {
  background: var(--accent-emerald);
  border-color: var(--accent-emerald);
  color: #ffffff;
  animation: scale-tap 200ms ease;
}

.habit-inline-input {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding-top: var(--space-sm);
  border-top: 1px solid var(--border);
  margin-top: var(--space-xs);
}

.habit-inline-input input {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  padding: 8px 12px;
  font-size: var(--text-sm);
}

.btn-inline {
  background: var(--gradient-primary);
  border: none;
  color: #fff;
  border-radius: var(--radius-sm);
  padding: 8px 16px;
  font-weight: 600;
  cursor: pointer;
  min-height: 40px;
}

/* FAB */
.fab {
  position: fixed;
  bottom: 84px;
  right: calc(50% - 220px);
  width: 56px;
  height: 56px;
  border-radius: var(--radius-full);
  background: var(--gradient-primary);
  border: none;
  color: #ffffff;
  font-size: 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-glow-purple);
  cursor: pointer;
  z-index: var(--z-fab);
  transition: transform var(--transition-fast);
}

.fab:active {
  transform: scale(0.9);
}

@media (max-width: 480px) {
  .fab {
    right: 20px;
  }
}

/* Modal & Bottom Sheet */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  z-index: var(--z-overlay);
}

.modal-overlay.active {
  display: block;
}

.bottom-sheet {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  width: 100%;
  max-width: 480px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: var(--space-lg);
  z-index: var(--z-modal);
  transition: transform var(--transition-slow);
  max-height: 90vh;
  overflow-y: auto;
}

.bottom-sheet.active {
  transform: translateX(-50%) translateY(0);
}

.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-lg);
}

.sheet-header h3 {
  font-size: var(--text-xl);
  font-weight: 700;
}

.btn-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
}

/* Form Styling */
.form-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  margin-bottom: var(--space-md);
}

.form-group label {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-input {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  color: var(--text-primary);
  font-size: var(--text-base);
  font-family: inherit;
}

.form-input:focus {
  outline: none;
  border-color: var(--border-focus);
}

.pill-group {
  display: flex;
  gap: var(--space-xs);
  flex-wrap: wrap;
}

.pill-btn {
  flex: 1;
  min-width: 80px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: var(--radius-md);
  padding: 10px;
  font-size: var(--text-xs);
  font-weight: 600;
  cursor: pointer;
  text-align: center;
}

.pill-btn.active {
  background: var(--accent-purple);
  border-color: var(--accent-purple);
  color: #ffffff;
}

.color-picker-grid {
  display: flex;
  gap: var(--space-sm);
  justify-content: space-between;
}

.color-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform var(--transition-fast);
}

.color-circle.selected {
  border-color: #ffffff;
  transform: scale(1.15);
}

.emoji-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: var(--space-xs);
  max-height: 120px;
  overflow-y: auto;
}

.emoji-item {
  font-size: 1.4rem;
  padding: 6px;
  border-radius: var(--radius-sm);
  text-align: center;
  cursor: pointer;
}

.emoji-item.selected {
  background: var(--bg-elevated);
}

.btn-primary {
  width: 100%;
  background: var(--gradient-primary);
  border: none;
  color: #ffffff;
  padding: 14px;
  border-radius: var(--radius-md);
  font-size: var(--text-base);
  font-weight: 700;
  cursor: pointer;
  margin-top: var(--space-md);
  min-height: 48px;
}

/* Contribution Graph */
.contribution-graph {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  margin-bottom: var(--space-lg);
  overflow-x: auto;
}

.graph-grid {
  display: grid;
  grid-template-rows: repeat(7, 12px);
  grid-auto-flow: column;
  gap: 4px;
}

.graph-cell {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  background: var(--bg-elevated);
}

.graph-cell.level-1 { background: rgba(139, 92, 246, 0.3); }
.graph-cell.level-2 { background: rgba(139, 92, 246, 0.6); }
.graph-cell.level-3 { background: rgba(139, 92, 246, 0.85); }
.graph-cell.level-4 { background: #8b5cf6; box-shadow: 0 0 6px #8b5cf6; }

/* Calendar Grid */
.calendar-view {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-md);
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--space-xs);
  text-align: center;
}

.cal-day-label {
  font-size: var(--text-xs);
  color: var(--text-muted);
  padding-bottom: var(--space-xs);
}

.cal-day-cell {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  font-size: var(--text-xs);
  cursor: pointer;
  background: var(--bg-elevated);
  position: relative;
}

.cal-day-cell.today {
  border: 1px solid var(--accent-purple);
  font-weight: 700;
}

.cal-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent-emerald);
  position: absolute;
  bottom: 3px;
}

/* Stats Cards */
.stats-overview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-md);
  margin-bottom: var(--space-lg);
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  text-align: center;
}

.stat-value {
  font-size: var(--text-3xl);
  font-weight: 800;
  color: var(--accent-purple);
}

.stat-label {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  margin-top: 4px;
}

/* Settings List */
.settings-group {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  margin-bottom: var(--space-md);
}

.settings-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.settings-item:last-child {
  border-bottom: none;
}

/* Toggle Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 48px;
  height: 26px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: var(--bg-input);
  border: 1px solid var(--border);
  transition: .4s;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: var(--text-secondary);
  transition: .4s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--accent-purple);
}

input:checked + .slider:before {
  transform: translateX(22px);
  background-color: #ffffff;
}

/* Toast Notifications */
.toast {
  position: fixed;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 12px 24px;
  border-radius: var(--radius-full);
  font-size: var(--text-sm);
  font-weight: 600;
  box-shadow: var(--shadow-card);
  z-index: var(--z-toast);
  transition: top var(--transition-base);
  pointer-events: none;
  white-space: nowrap;
}

.toast.show {
  top: 20px;
}

.toast-success { border-color: var(--accent-emerald); background: rgba(16, 185, 129, 0.15); }
.toast-error { border-color: var(--accent-rose); background: rgba(244, 63, 94, 0.15); }
.toast-info { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.15); }

/* Skeleton Loading Shimmer */
.skeleton-card {
  height: 72px;
  background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: skeleton-shimmer 1.5s infinite;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
}

@keyframes skeleton-shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}


/* Animations */
@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pulse-glow {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(139,92,246,0.3)); }
  50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(139,92,246,0.6)); }
}

@keyframes fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes scale-tap {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: var(--space-2xl) var(--space-md);
  color: var(--text-muted);
}

.empty-icon {
  font-size: 3rem;
  margin-bottom: var(--space-sm);
}
</style>
